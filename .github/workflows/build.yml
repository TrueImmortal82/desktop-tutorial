name: Build Windows application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WindowsAdminShortcuts.sln

      - name: Build
        run: dotnet build WindowsAdminShortcuts.sln --configuration Release --no-restore

      - name: Run invariant tests
        run: dotnet run --project tests/WindowsAdminShortcuts.Tests/WindowsAdminShortcuts.Tests.csproj --configuration Release --no-build

      - name: Publish single-file EXE
        run: >-
          dotnet publish src/WindowsAdminShortcuts/WindowsAdminShortcuts.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output dist

      - name: Add and verify package files
        shell: pwsh
        run: |
          Copy-Item Start-WindowsAdminShortcuts.bat dist/Start-WindowsAdminShortcuts.bat
          if (-not (Test-Path dist/LICENSE.txt)) {
            throw "LICENSE.txt is missing from the published package."
          }
          $license = [IO.File]::ReadAllText("dist/LICENSE.txt")
          if (-not $license.Contains("AS IS") -or -not $license.Contains("WITHOUT WARRANTY")) {
            throw "Published license does not contain the AS IS warranty disclaimer."
          }
          $bytes = [IO.File]::ReadAllBytes("dist/Start-WindowsAdminShortcuts.bat")
          for ($i = 0; $i -lt $bytes.Length; $i++) {
            if ($bytes[$i] -eq 10 -and ($i -eq 0 -or $bytes[$i - 1] -ne 13)) {
              throw "Launcher BAT contains LF without CRLF."
            }
          }

      - name: Upload application package
        uses: actions/upload-artifact@v4
        with:
          name: WindowsAdminShortcuts-win-x64
          path: |
            dist/WindowsAdminShortcuts.exe
            dist/Start-WindowsAdminShortcuts.bat
            dist/LICENSE.txt
          if-no-files-found: error
